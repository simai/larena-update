package: larena/update-client
title: Larena Update Client
status: g4_8_local_fixture_runtime
cluster: update-delivery
batch: g4-8-update-ownership-reconciliation
features:
  - update.admin_diagnostics
  - update.artifact_verification
  - update.entitlement_proxy
  - update.installer_orchestration
  - update.manifest_plan
  - update.preflight_rollback
  - update.local_fixture_cycle
  - update.recoverable_retry
runtime:
  php: "^8.3"
  laravel: "^13.0"
runtime_boundaries:
  canonical_local_runtime_owner: true
  server_catalog_authority: false
  network_fetch_enabled: true          # signed releases over HTTPS from the configured sources
  real_artifact_apply_enabled: true    # larena:update:apply, operator-started only
  installed_site_mutation_enabled: true
  reference_store: update_cycles_table
  trusted_release_keys: config_only    # none shipped; every release is refused until keys are configured
  production_ready: false
evidence:
  path: docs/project-management/evidence/larena-specification-g4/g4-8/update-ownership-reconciliation/
